global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: modu-square-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - article:9000
          - comment:9001
          - like:9002
          - view:9003
          - hot-article:9004
          - article-read:9005
          - notification:9006
          - media:9007
          - search:9008

  - job_name: modu-square-mysql
    static_configs:
      - targets: [mysql-exporter:9104]

  - job_name: modu-square-redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: modu-square-kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

# k6 부하 테스트 결과는 scrape가 아니라 remote write로 유입된다.
# prometheus 컨테이너는 --web.enable-remote-write-receiver 로 기동되며,
# k6는 experimental-prometheus-rw output으로 http://prometheus:9090/api/v1/write 에 전송한다.
