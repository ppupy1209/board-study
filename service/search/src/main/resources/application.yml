server:
  port: 9008
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
spring:
  application:
    name: modu-square-search-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: modu-square-search-service
      auto-offset-reset: earliest
search:
  elasticsearch-url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
  article-service-url: ${ARTICLE_SERVICE_URL:http://127.0.0.1:9000}
  reindex-batch-size: ${SEARCH_REINDEX_BATCH_SIZE:5000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      service: ${spring.application.name}
